<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم إلى مؤسسي مجتمع ONERAY التعليمي</title>
    <style>
        :root {
            --black: #0a0a0a;
            --white: #f5f5f5;
            --yellow: #f5c518;
            --dark-gray: #1a1a1a;
            --medium-gray: #2a2a2a;
            --light-gray: #cccccc;
            --error-red: #ff4444;
            --success-green: #00c853;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Cairo', 'Tahoma', sans-serif;
            background-color: var(--black);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px;
            background-image: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #000000 90%);
        }

        .form-container {
            background-color: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid #333;
            border-radius: 24px;
            padding: 45px 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(245, 197, 24, 0.15);
            transition: all 0.3s ease;
        }

        .form-container:hover {
            box-shadow: 0 35px 70px rgba(0,0,0,0.9), 0 0 0 1px rgba(245, 197, 24, 0.3);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .oneray-logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--white);
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            display: inline-block;
            padding: 12px 35px;
            border-radius: 50px;
            border: 2px solid var(--yellow);
            box-shadow: 0 0 30px rgba(245, 197, 24, 0.3);
            margin-bottom: 12px;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 15px 0 10px;
            color: var(--white);
            line-height: 1.4;
        }

        .title-highlight {
            color: var(--yellow);
            border-bottom: 3px solid var(--yellow);
            padding-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
            font-size: 1rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--light-gray);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .required-star {
            color: var(--yellow);
            margin-right: 5px;
            font-size: 1.2rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px 18px;
            background-color: var(--dark-gray);
            border: 1.5px solid #333;
            border-radius: 14px;
            color: var(--white);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.25s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--yellow);
            box-shadow: 0 0 15px rgba(245, 197, 24, 0.3);
            background-color: #1f1f1f;
        }

        input::placeholder, textarea::placeholder {
            color: #777;
            font-size: 0.9rem;
        }

        select {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="%23f5c518"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: left 15px center;
            background-size: 20px;
        }

        select option {
            background-color: #1a1a1a;
            color: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--yellow);
            color: #000;
            font-weight: 800;
            font-size: 1.2rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(245, 197, 24, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .submit-btn:hover {
            background: #f5d547;
            box-shadow: 0 12px 28px rgba(245, 197, 24, 0.7);
            transform: translateY(-2px);
            color: #000;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }

        .success-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .success-box {
            background: #111;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid var(--yellow);
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="logo-area">
            <div class="oneray-logo">ONERAY</div>
        </div>
        <h1 class="title">انضم إلى <span class="title-highlight">مؤسسي</span> مجتمع ONERAY التعليمي</h1>
        <p class="subtitle">كن جزءاً من النواة الأولى لبناء المستقبل التعليمي</p>

        <form id="founderForm">
            <div class="form-group">
                <label><span class="required-star">*</span>الاسم الكامل</label>
                <input type="text" id="name" placeholder="أدخل اسمك الثلاثي" required>
                <div class="error-message" id="nameError">الاسم مطلوب</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>المرحلة الدراسية</label>
                <select id="stage" required>
                    <option value="" disabled selected>-- اختر المرحلة --</option>
                    <option value="طالب">طالب</option>
                    <option value="خريج">خريج</option>
                    <option value="موظف">موظف</option>
                    <option value="استاذ جامعي">استاذ جامعي</option>
                </select>
                <div class="error-message" id="stageError">المرحلة الدراسية مطلوبة</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>الجامعة</label>
                <input type="text" id="university" placeholder="مثال: جامعة القاهرة" required>
                <div class="error-message" id="universityError">الجامعة مطلوبة</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>المهارات</label>
                <input type="text" id="skills" placeholder="مثال: الكتابة - التدقيق - التصميم - البرمجة" required>
                <div class="error-message" id="skillsError">المهارات مطلوبة</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>حساب الانستغرام</label>
                <input type="text" id="instagram" placeholder="مثال: @username" required>
                <div class="error-message" id="instagramError">حساب الانستغرام مطلوب</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>حساب التليغرام</label>
                <input type="text" id="telegram" placeholder="مثال: @username" required>
                <div class="error-message" id="telegramError">حساب التليغرام مطلوب</div>
            </div>

            <div class="form-group">
                <label><span class="required-star">*</span>لماذا تريد الانضمام؟</label>
                <textarea id="reason" placeholder="اشرح دوافعك للانضمام إلينا..." required></textarea>
                <div class="error-message" id="reasonError">هذا الحقل مطلوب</div>
            </div>

            <button type="submit" class="submit-btn">تقديم الطلب 🚀</button>
        </form>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-box">
            <h2 style="color: #f5c518; font-size: 2rem;">✅ تم تقديم طلبك بنجاح</h2>
            <p style="color: #ccc; margin: 15px 0;">سنقوم بمراجعة طلبك والتواصل معك بأقرب وقت ممكن</p>
            <button onclick="closeSuccess()" style="background:#f5c518; color:#000; padding:12px 30px; border:none; border-radius:20px; font-weight:bold; cursor:pointer;">حسناً</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHTO1RQst9ts_4SR_Bd4Akb-4VljtNIOs",
            authDomain: "lunex-jewe.firebaseapp.com",
            databaseURL: "https://lunex-jewe-default-rtdb.firebaseio.com",
            projectId: "lunex-jewe",
            storageBucket: "lunex-jewe.firebasestorage.app",
            messagingSenderId: "79262821764",
            appId: "1:79262821764:web:4d233a2effff6a9ff0c1d1",
            measurementId: "G-K5PKPK51VM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('founderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const stage = document.getElementById('stage').value;
            const university = document.getElementById('university').value.trim();
            const skills = document.getElementById('skills').value.trim();
            const instagram = document.getElementById('instagram').value.trim();
            const telegram = document.getElementById('telegram').value.trim();
            const reason = document.getElementById('reason').value.trim();

            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            let isValid = true;

            if (!name) { document.getElementById('nameError').style.display = 'block'; isValid = false; }
            if (!stage) { document.getElementById('stageError').style.display = 'block'; isValid = false; }
            if (!university) { document.getElementById('universityError').style.display = 'block'; isValid = false; }
            if (!skills) { document.getElementById('skillsError').style.display = 'block'; isValid = false; }
            if (!instagram) { document.getElementById('instagramError').style.display = 'block'; isValid = false; }
            if (!telegram) { document.getElementById('telegramError').style.display = 'block'; isValid = false; }
            if (!reason) { document.getElementById('reasonError').style.display = 'block'; isValid = false; }

            if (!isValid) return;

            try {
                const membersRef = ref(db, 'members');
                const newMemberRef = push(membersRef);
                await set(newMemberRef, {
                    name,
                    stage,
                    university,
                    skills,
                    instagram,
                    telegram,
                    reason,
                    timestamp: new Date().toISOString()
                });
                
                document.getElementById('successOverlay').style.display = 'flex';
                document.getElementById('founderForm').reset();
                document.getElementById('stage').value = '';
            } catch (error) {
                alert('حدث خطأ أثناء التسجيل: ' + error.message);
                console.error(error);
            }
        });

        window.closeSuccess = function() {
            document.getElementById('successOverlay').style.display = 'none';
        };
    </script>
</body>
</html>
